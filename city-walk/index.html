<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>City walk preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import { createScene, DURATION } from './scene.js';
  const q = new URLSearchParams(location.search);
  const w = +(q.get('w') || 576), h = +(q.get('h') || 1024);
  const canvas = document.getElementById('c');
  const app = createScene(canvas, w, h);
  window.renderAt = t => app.render(t);   // used by render.mjs for deterministic frame export
  window.ready = true;
  if (!q.has('export')) {                 // live preview: loops in real time
    const t0 = performance.now();
    const loop = now => { app.render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
</script>
</body>
</html>
