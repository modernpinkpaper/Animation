    const cardEl = $('card'); if (shown) { if (cardEl.dataset.k !== shown.t) { cardEl.dataset.k = shown.t; $('cardT').textContent = shown.t; $('cardT').style.background = shown.c || '#7a56d8'; $('cardL').innerHTML = shown.b.map(x => '<li>' + x + '</li>').join(''); } cardEl.style.opacity = clamp(ci); cardEl.style.transform = `translateY(${(1 - clamp(ci)) * 24}px)`; } else cardEl.style.opacity = 0; }
  // captions
  if (sp >= 0) { const L0 = LINES[sp], ch = CH[sp]; const tot = ch.reduce((a, c) => a + c.length, 0); let acc = 0; const k = seg(t, L0.v0, L0.v1) * tot; let ci = ch.length - 1; for (let i = 0; i < ch.length; i++) { acc += ch[i].length; if (k <= acc) { ci = i; break; } } capt.textContent = ch[ci]; cap.style.opacity = 1; } else cap.style.opacity = 0;
  // end card
  const ek = seg(t, D.end + 0.8, D.end + 1.6); end1.style.opacity = ek; end2.style.opacity = seg(t, D.end + 2.0, D.end + 2.8);
  fade.style.opacity = Math.max(0.78 * ek, 1 - seg(t, 0, 0.5)); badge.style.opacity = 1 - ek;
  renderer.render(scene, camera);
}
window.renderFrame = renderFrame; window.TOTAL = TOTAL; window.ready = true;
</script>
